name: cnh

services:
  elasticsearch:
    build: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    profiles: [kibana]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - 127.0.0.1:5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy

  redis:
    image: redis:8.6-alpine
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elasticsearch:
