apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: cnh
spec:
  version: 9.5.6
  count: 1
  elasticsearchRef:
    name: cnh
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rem-4
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
