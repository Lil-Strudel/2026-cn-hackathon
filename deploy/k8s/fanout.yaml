apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fanout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fanout
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fanout
          image: fanout
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fanout
spec:
  selector:
    app.kubernetes.io/name: fanout
  ports:
    - name: http
      port: 8080
      targetPort: http
