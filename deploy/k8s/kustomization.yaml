apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - kustomizeconfig.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: cnh
resources:
  - network-policy.yaml
  - redis.yaml
  - elasticsearch.yaml
  - kibana.yaml
  - api.yaml
  - fanout.yaml
  - web.yaml
images:
  - name: api
    newName: ghcr.io/lil-strudel/2026-cn-hackathon/api
    newTag: main
  - name: fanout
    newName: ghcr.io/lil-strudel/2026-cn-hackathon/fanout
    newTag: main
  - name: web
    newName: ghcr.io/lil-strudel/2026-cn-hackathon/web
    newTag: main
  - name: elasticsearch
    newName: ghcr.io/lil-strudel/2026-cn-hackathon/elasticsearch
    newTag: main
